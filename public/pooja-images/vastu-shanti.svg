<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="bg5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F0FFF0"/>
      <stop offset="100%" style="stop-color:#E0F0E0"/>
    </linearGradient>
    <linearGradient id="house5" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#E07B39"/>
      <stop offset="100%" style="stop-color:#CD853F"/>
    </linearGradient>
    <linearGradient id="roof5" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#8B1A1A"/>
      <stop offset="100%" style="stop-color:#6B0F0F"/>
    </linearGradient>
    <radialGradient id="positivity" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#4CAF50;stop-opacity:0.15"/>
      <stop offset="100%" style="stop-color:#4CAF50;stop-opacity:0"/>
    </radialGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bg5)"/>
  <!-- Positive energy glow -->
  <circle cx="200" cy="150" r="100" fill="url(#positivity)"/>
  <!-- Vastu grid lines -->
  <g stroke="#4CAF50" stroke-opacity="0.08" stroke-width="0.5">
    <line x1="120" y1="100" x2="120" y2="260"/>
    <line x1="160" y1="100" x2="160" y2="260"/>
    <line x1="200" y1="100" x2="200" y2="260"/>
    <line x1="240" y1="100" x2="240" y2="260"/>
    <line x1="280" y1="100" x2="280" y2="260"/>
    <line x1="120" y1="140" x2="280" y2="140"/>
    <line x1="120" y1="180" x2="280" y2="180"/>
    <line x1="120" y1="220" x2="280" y2="220"/>
  </g>
  <!-- House structure -->
  <!-- Roof -->
  <polygon points="200,75 130,130 270,130" fill="url(#roof5)"/>
  <polygon points="200,82 138,130 262,130" fill="#A02020"/>
  <!-- Roof ridge -->
  <line x1="200" y1="75" x2="200" y2="68" stroke="#D4A017" stroke-width="2"/>
  <circle cx="200" cy="65" r="5" fill="#D4A017"/>
  <!-- Walls -->
  <rect x="140" y="130" width="120" height="100" fill="url(#house5)"/>
  <!-- Door -->
  <rect x="180" y="170" width="40" height="60" rx="20" fill="#6B0F0F"/>
  <rect x="184" y="174" width="32" height="56" rx="16" fill="#8B1A1A"/>
  <circle cx="208" cy="200" r="3" fill="#D4A017"/>
  <!-- Windows -->
  <rect x="148" y="148" width="24" height="20" rx="3" fill="#87CEEB" stroke="#D4A017" stroke-width="1"/>
  <line x1="160" y1="148" x2="160" y2="168" stroke="#D4A017" stroke-width="0.5"/>
  <line x1="148" y1="158" x2="172" y2="158" stroke="#D4A017" stroke-width="0.5"/>
  <rect x="228" y="148" width="24" height="20" rx="3" fill="#87CEEB" stroke="#D4A017" stroke-width="1"/>
  <line x1="240" y1="148" x2="240" y2="168" stroke="#D4A017" stroke-width="0.5"/>
  <line x1="228" y1="158" x2="252" y2="158" stroke="#D4A017" stroke-width="0.5"/>
  <!-- Toran (door hanging) -->
  <path d="M178 170 Q190 162 200 165 Q210 162 222 170" stroke="#D4A017" stroke-width="2" fill="none"/>
  <circle cx="185" cy="168" r="3" fill="#FF6B6B"/>
  <circle cx="200" cy="165" r="3" fill="#FFB347"/>
  <circle cx="215" cy="168" r="3" fill="#FF6B6B"/>
  <!-- Compass rose -->
  <g transform="translate(330,60)" opacity="0.25">
    <circle r="20" fill="none" stroke="#4CAF50" stroke-width="1"/>
    <text y="-22" text-anchor="middle" font-size="8" fill="#4CAF50" font-weight="bold">N</text>
    <text y="28" text-anchor="middle" font-size="8" fill="#4CAF50" font-weight="bold">S</text>
    <text x="25" y="4" text-anchor="middle" font-size="8" fill="#4CAF50" font-weight="bold">E</text>
    <text x="-25" y="4" text-anchor="middle" font-size="8" fill="#4CAF50" font-weight="bold">W</text>
    <line x1="0" y1="-18" x2="0" y2="18" stroke="#4CAF50" stroke-width="1"/>
    <line x1="-18" y1="0" x2="18" y2="0" stroke="#4CAF50" stroke-width="1"/>
  </g>
  <!-- Plants / greenery -->
  <ellipse cx="110" cy="230" rx="12" ry="6" fill="#2E8B57" opacity="0.6"/>
  <ellipse cx="108" cy="225" rx="10" ry="15" fill="#228B22" opacity="0.5"/>
  <rect x="107" y="230" width="3" height="10" fill="#8B4513"/>
  <ellipse cx="290" cy="230" rx="12" ry="6" fill="#2E8B57" opacity="0.6"/>
  <ellipse cx="292" cy="225" rx="10" ry="15" fill="#228B22" opacity="0.5"/>
  <rect x="290" y="230" width="3" height="10" fill="#8B4513"/>
  <!-- Ground -->
  <rect x="100" y="230" width="200" height="4" rx="2" fill="#CD853F" opacity="0.3"/>
  <!-- Swastik -->
  <g transform="translate(200, 105)" opacity="0.2" fill="#D4A017">
    <rect x="-8" y="-1.5" width="16" height="3"/>
    <rect x="-1.5" y="-8" width="3" height="16"/>
    <rect x="6.5" y="-8" width="3" height="5"/>
    <rect x="-9.5" y="3" width="3" height="5"/>
    <rect x="6.5" y="3" width="5" height="3"/>
    <rect x="-9.5" y="-6" width="5" height="3"/>
  </g>
</svg>